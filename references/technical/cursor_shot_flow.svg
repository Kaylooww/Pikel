<rect x="40" y="160" width="195" height="116" rx="17" fill="#17324d"/><text x="137" y="203" fill="#fff">MOUSE CURSOR</text><text x="137" y="231" fill="#bde8f1" font-size="15">ray → court plane</text>
<rect x="298" y="160" width="195" height="116" rx="17" fill="#32b6ad"/><text x="395" y="204" fill="#123f48">SHOT INTENT</text><text x="395" y="232" fill="#123f48" font-size="15">type • target • timing</text>
